[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader = "0.9"
multiboot2 = "0.24.1"
volatile = "0.6.1"

[build-dependencies]
cc = "1.2.63"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# Double brackets for keys that can appear multiple times
# For rust-analyzer, test and bench modes include std by default.
# Specify that we do not support test/bench builds, to suppress errors.
[[bin]]
name = "kernel"
test = false
bench = false
